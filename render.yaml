# Blueprint do Render (render.com/docs/blueprint-spec). Em render.com/deploys,
# "New +" > "Blueprint" apontando pra este repositório lê este arquivo sozinho.
#
# O plano free não dá acesso a Shell, então o próprio container cria o admin
# sozinho a cada start (ver dashboard/management/commands/ensure_superuser.py e
# o CMD do Dockerfile) — a senha é gerada pelo Render, veja em Environment no
# painel do serviço depois do deploy.
#
# Banco: PostgreSQL externo (Neon, Supabase, ou qualquer provedor com connection
# string). O Render não tem "databases:" gerenciado nesse Blueprint porque o
# Postgres do próprio Render deixou de ter plano free permanente — por isso as
# credenciais abaixo são "sync: false": o Render vai pedir pra você colar os
# valores manualmente no painel (Environment) na primeira vez, e não ficam no
# git. Depois de criar o banco no Neon/Supabase, preencha DB_NAME/DB_USER/
# DB_PASSWORD/DB_HOST (e DB_PORT se for diferente de 5432) com os dados da
# connection string fornecida por eles.
services:
  - type: web
    name: connect-talk
    runtime: docker
    plan: free
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      - key: WHATSAPP_SEND_MODE
        value: dry_run
      - key: WHATSAPP_PROVIDER
        value: mock
      - key: DB_ENGINE
        value: postgresql
      - key: DB_SSLMODE
        value: require
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
